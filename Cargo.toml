[package]
name = "amdgpu-control"
version = "2.0.0"
edition = "2021"
rust-version = "1.87"
description = "Painel GNOME nativo para monitorar e ajustar GPUs AMD"
license = "GPL-3.0-or-later"

[dependencies]
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_7"] }
gio = "0.22"
glib = "0.22"
gtk = { package = "gtk4", version = "0.11.4", features = ["v4_18"] }
ksni = { version = "0.3.6", default-features = false, features = ["async-io", "blocking"] }
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.23"

[[bin]]
name = "amdgpu-control"
path = "src/main.rs"

[[bin]]
name = "amdgpu-control-helper"
path = "src/bin/amdgpu-control-helper.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
